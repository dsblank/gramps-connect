x-app-image: &app-image
  # Prebuilt by .github/workflows/build-docker.yml (workflow_dispatch) and
  # pushed to GHCR -- `docker compose pull` grabs that instead of building
  # locally. `build:` is still here as a fallback for local iteration
  # (`docker compose build` tags the result with this same name). The build
  # itself is just an `npm run build -w app` layered onto the official
  # dmstraub/gramps-webapi image now (see deploy/Dockerfile), so it's fast
  # either way -- no from-source gramps/gramps-web-api clone anymore.
  image: ghcr.io/dsblank/gramps-connect:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-app-env: &app-env
  # Multi-tree mode, required for the SharedPostgreSQL backend.
  GRAMPSWEB_TREE: "*"
  GRAMPSWEB_NEW_DB_BACKEND: sharedpostgresql
  GRAMPSWEB_POSTGRES_HOST: postgres
  GRAMPSWEB_POSTGRES_PORT: "5432"
  GRAMPSWEB_POSTGRES_USER: ${POSTGRES_USER}
  GRAMPSWEB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # Required in multi-tree mode: without this, media files are not
  # scoped per tree and are exposed across trees (gramps-web-api warns
  # loudly about this at startup if left False).
  GRAMPSWEB_MEDIA_PREFIX_TREE: "True"
  # Leave GRAMPSWEB_SECRET_KEY unset in .env to have the entrypoint
  # generate and persist one on first boot instead.
  GRAMPSWEB_SECRET_KEY: ${GRAMPSWEB_SECRET_KEY:-}
  GRAMPSWEB_ADMIN_USER: ${GRAMPSWEB_ADMIN_USER}
  GRAMPSWEB_ADMIN_PASSWORD: ${GRAMPSWEB_ADMIN_PASSWORD}
  GRAMPSWEB_CELERY_CONFIG__broker_url: redis://redis:6379/0
  GRAMPSWEB_CELERY_CONFIG__result_backend: redis://redis:6379/0
  # Flask-Limiter defaults to in-memory rate-limit storage, which is
  # per-process and resets on restart -- point it at redis instead.
  GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://redis:6379/2
  GRAMPSWEB_BASE_URL: ${PUBLIC_URL}
  GRAMPSWEB_DISABLE_TELEMETRY: "True"
  # This backend is now the same unmodified image gramps-web itself runs
  # on (see deploy/Dockerfile), so a separately-hosted gramps-web frontend
  # (a different origin than this deployment's own PUBLIC_URL) can point
  # at /api/ here too -- but Flask-Cors rejects it by default until its
  # origin is allowed here. Empty by default (same-origin gramps-connect
  # keeps working either way); set to that origin, or "*", in deploy/.env
  # to opt in.
  GRAMPSWEB_CORS_ORIGINS: ${GRAMPSWEB_CORS_ORIGINS:-}

x-app-volumes: &app-volumes
  # /root/.gramps/grampsdb (not /app/db) is where the official
  # dmstraub/gramps-webapi image sets GRAMPS_DATABASE_PATH -- see its own
  # Dockerfile and gramps-web-docs' docker-compose-base example. Each tree
  # gets a metadata directory here even under the SharedPostgreSQL backend
  # (the actual row data lives in postgres; this still holds per-tree
  # name.txt/database.txt).
  - app-db:/root/.gramps/grampsdb
  - app-media:/app/media
  - app-indexdir:/app/indexdir
  - app-users:/app/users
  - app-secret:/app/secret
  # Import/export/media-archive-upload write a temp file here from the app
  # container's request handler, then a Celery task on the worker container
  # reads it back -- must be shared, or the worker gets "No such file".
  - app-cache:/app/cache
  # Shared for the same reason as app-cache above -- matches the gramps_tmp
  # volume in gramps-web-docs' own reference docker-compose.yml.
  - app-tmp:/tmp

services:
  app:
    <<: *app-image
    environment:
      <<: *app-env
    volumes: *app-volumes
    # No published port here -- caddy is the only entrypoint (see below),
    # so nothing can reach app directly over plain HTTP bypassing TLS.
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Import, media-archive-upload, search-indexing, etc. all dispatch through
  # Celery (GRAMPSWEB_CELERY_CONFIG__* above) instead of running inline --
  # without a worker consuming that queue, those requests return a task ID
  # that never completes.
  worker:
    <<: *app-image
    environment:
      <<: *app-env
      # The app service owns migrations/admin-seeding on startup; running
      # both concurrently against the same sqlite USER_DB_URI volume risks
      # "database is locked" (see deploy/docker-entrypoint.sh).
      SKIP_MIGRATE_AND_SEED: "1"
    volumes: *app-volumes
    depends_on:
      - postgres
      - redis
    # --pool=solo: avoid celery's default prefork pool. Suspected cause of
    # "Import failed" with no real error (see investigation notes) --
    # Gramps' plugin registration lazily touches real GTK/GObject state
    # (gtk_icon_theme_get_for_screen fires on first plugin load), which
    # doesn't appear to survive celery forking a child process cleanly.
    command: celery -A gramps_webapi.celery worker --loglevel=info --pool=solo
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: valkey/valkey:alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-db:
  app-media:
  app-indexdir:
  app-users:
  app-secret:
  app-cache:
  app-tmp:
  postgres-data:
  # caddy-data holds the generated local CA / certs -- persisting it means
  # restarts don't regenerate the CA and re-trigger a browser trust prompt.
  caddy-data:
  caddy-config:
