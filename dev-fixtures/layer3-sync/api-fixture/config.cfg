# Multi-tree gramps-web-api instance backed by SharedPostgreSQL, pointing
# at the pre-existing "gramps" Postgres database (leftover from the
# earlier gramps-web-api session's own "live-verified against a real
# 100k-person SharedPostgreSQL database" work -- see PLAN-gramps-web-api-
# fast-query.md's grounding notes) rather than importing fresh.
#
# Normal per-request tree access uses ONE fixed POSTGRES_USER/PASSWORD
# from this config for every user/tree uniformly (see api/util.py's
# get_db_manager) -- not, as dbloader.py's own docstring might suggest,
# each app user's own login credentials. Tree *creation*
# (resources/trees.py's POST /trees/) is a separate code path that
# doesn't read POSTGRES_USER/PASSWORD at all, so a ~/.pgpass entry for
# this role is also required for that specific call to authenticate --
# see setup.sh.
TREE="*"
NEW_DB_BACKEND="sharedpostgresql"
POSTGRES_HOST="localhost"
POSTGRES_PORT="5432"
POSTGRES_USER="gramps"
POSTGRES_PASSWORD="gramps"
MEDIA_PREFIX_TREE=True
SECRET_KEY="qP3xR8vN2mK6jL9wZ4tY1bH7cF0dS5aE"
# Derived from this file's own location rather than hardcoded: gramps-web-api
# loads the config with Flask's from_pyfile(), i.e. executes it as Python, so
# __file__ is available here. A plain relative sqlite:/// URI would not work --
# Flask-SQLAlchemy resolves those against the app's instance path, not the cwd --
# and an absolute path only ever worked on the machine that wrote it.
import os

_HERE = os.path.dirname(os.path.abspath(__file__))
USER_DB_URI = "sqlite:///" + os.path.join(_HERE, "data", "users.sqlite")
CORS_ORIGINS="*"
