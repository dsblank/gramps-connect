# Second, separate single-tree gramps-web-api instance, loaded with
# Gramps' own official example.gramps sample database (rich date variety
# -- modifiers, quality, ranges/spans -- unlike api-fixture's
# gramps-bench-generated data, which is all plain unmodified dates).
#
# A tree name can only be auto-created via WebDbManager's create_if_missing
# at *app startup* for the single TREE this config names (see
# gramps-web-api's app.py) -- there's no way to add a second tree to a
# single-tree instance at runtime, hence a whole separate instance/port
# rather than a second tree on api-fixture's server.

TREE="example-db"
SECRET_KEY="8xQmN2vK5jL9pR3wZ7tY1bC4hF6sD0aE"
# Derived from this file's own location rather than hardcoded: gramps-web-api
# loads the config with Flask's from_pyfile(), i.e. executes it as Python, so
# __file__ is available here. A plain relative sqlite:/// URI would not work --
# Flask-SQLAlchemy resolves those against the app's instance path, not the cwd --
# and an absolute path only ever worked on the machine that wrote it.
import os

_HERE = os.path.dirname(os.path.abspath(__file__))
USER_DB_URI = "sqlite:///" + os.path.join(_HERE, "data", "users.sqlite")
CORS_ORIGINS="*"
