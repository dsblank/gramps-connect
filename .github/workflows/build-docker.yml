name: Build and push Docker image

# Manual trigger only: this builds deploy/Dockerfile (which layers
# gramps-connect's frontend onto the official, upstream-published
# dmstraub/gramps-webapi backend image -- see that file's own comments) and
# pushes the result to GHCR, so a deployment host can `docker compose pull`
# a finished image instead of building it locally.
on:
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gramps-connect
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/gramps-connect-caddy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to GHCR under this repo's owner.
      packages: write
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Caddy with the rate-limit module (deploy/Dockerfile.caddy). Rebuilt
      # every run, but its inputs are pinned, so the gha cache makes that
      # nearly free.
      - name: Build and push Caddy
        uses: docker/build-push-action@v7
        with:
          context: deploy
          file: deploy/Dockerfile.caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
