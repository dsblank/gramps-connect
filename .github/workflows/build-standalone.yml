name: Build standalone demo

# Manual trigger only -- this is an experimental PyInstaller build (see
# standalone/), not part of the normal dev workflow, and Windows/macOS
# runners are the whole point of running it here: PyInstaller can't
# cross-compile, so producing those binaries requires actually running on
# those OSes, which no local dev machine in this project has.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64) as of the macos-14 image;
        # macos-13 is the last Intel (x86_64) image GitHub hosts, needed
        # because PyInstaller bundles a native binary for the runner's own
        # arch only -- an arm64 build errors "bad CPU type in executable"
        # on Intel Macs. `label` names the upload artifact / zip so it
        # stays stable even if GitHub re-points macos-latest again.
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v4
        with:
          path: gramps-connect

      # gramps' core install (install_requires=["orjson"]) never pulls in
      # PyGObject -- that's GUI-only extras -- so a plain editable install
      # is enough; standalone/runtime_hooks/rthook_gi_stub.py replaces the
      # one place gramps-web-api's reachable code path unconditionally
      # touches `gi` (gen/const.py's XDG-path lookups) with a small stub,
      # so real PyGObject/GTK -- notoriously painful to bundle with
      # PyInstaller on every platform, and the reason Gramps' own macOS
      # build uses a separate jhbuild toolchain instead -- is never needed
      # at all here.
      - name: Check out gramps (maintenance/gramps60)
        uses: actions/checkout@v4
        with:
          repository: gramps-project/gramps
          ref: maintenance/gramps60
          path: gramps

      # The ten /api/<type>/query/ endpoints this project's client is built
      # on (https://github.com/gramps-project/gramps-web-api/pull/913) are
      # merged upstream now, so this tracks gramps-project master rather
      # than the dsblank/gramps-web-api feat/object-query-endpoints branch
      # it used to (matches deploy/Dockerfile's own switch).
      - name: Check out gramps-web-api (master)
        uses: actions/checkout@v4
        with:
          repository: gramps-project/gramps-web-api
          ref: master
          path: gramps-web-api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build app/ frontend
        working-directory: gramps-connect
        env:
          # Frontend and API share an origin in this build (see
          # launcher.py's STATIC_PATH), so requests should be relative --
          # app/src/config.ts already falls back to "" when this is unset,
          # but setting it explicitly here documents the intent.
          VITE_API_BASE: ""
        run: |
          npm install
          npm run build -w app

      - name: Copy frontend into standalone/
        shell: bash
        run: |
          rm -rf gramps-connect/standalone/frontend
          cp -r gramps-connect/app/dist gramps-connect/standalone/frontend

      - name: Install gramps + gramps-web-api (editable, from source)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e gramps --no-deps
          pip install -e gramps-web-api --no-deps

      # Read straight out of gramps-web-api's own pyproject.toml rather than
      # hand-copied, using the same filter deploy/Dockerfile.slim already
      # uses -- a hand-copied list here had already drifted (it pinned
      # gramps-object-query-language>=0.3.1 where upstream now says
      # >=0.3.4,<0.4) and would silently miss anything added upstream.
      # gramps[all]/PyGObject are skipped by the script (supplied via the
      # editable checkout above / stubbed, see above); pdf2image/
      # ffmpeg-python/boto3/pytesseract are skipped too -- real pyproject
      # deps, but only for optional features this build excludes (PDF/video
      # conversion, S3 storage, OCR; see the .spec's `excludes`).
      - name: Install remaining Python dependencies
        shell: bash
        run: |
          pip install pyinstaller pyinstaller-hooks-contrib
          python gramps-connect/deploy/webapi-requirements.py gramps-web-api/pyproject.toml > requirements.txt
          cat requirements.txt
          pip install -r requirements.txt psycopg2-binary

      - name: Build with PyInstaller
        working-directory: gramps-connect/standalone
        run: pyinstaller gramps-connect-demo.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramps-connect-demo-${{ matrix.label }}
          path: gramps-connect/standalone/dist/gramps-connect-demo
          if-no-files-found: error
