name: Build standalone demo

# Manual trigger only -- this is an experimental PyInstaller build (see
# standalone/), not part of the normal dev workflow, and Windows/macOS
# runners are the whole point of running it here: PyInstaller can't
# cross-compile, so producing those binaries requires actually running on
# those OSes, which no local dev machine in this project has.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v4
        with:
          path: gramps-connect

      # gramps' core install (install_requires=["orjson"]) never pulls in
      # PyGObject -- that's GUI-only extras -- so a plain editable install
      # is enough; standalone/runtime_hooks/rthook_gi_stub.py replaces the
      # one place gramps-web-api's reachable code path unconditionally
      # touches `gi` (gen/const.py's XDG-path lookups) with a small stub,
      # so real PyGObject/GTK -- notoriously painful to bundle with
      # PyInstaller on every platform, and the reason Gramps' own macOS
      # build uses a separate jhbuild toolchain instead -- is never needed
      # at all here.
      - name: Check out gramps (maintenance/gramps60)
        uses: actions/checkout@v4
        with:
          repository: gramps-project/gramps
          ref: maintenance/gramps60
          path: gramps

      # dsblank/gramps-web-api@feat/object-query-endpoints -- matches this
      # session's locally-tested source exactly (confirmed via `git log`
      # against the fork remote before writing this workflow).
      - name: Check out gramps-web-api (feat/object-query-endpoints)
        uses: actions/checkout@v4
        with:
          repository: dsblank/gramps-web-api
          ref: feat/object-query-endpoints
          path: gramps-web-api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build app/ frontend
        working-directory: gramps-connect
        env:
          # Frontend and API share an origin in this build (see
          # launcher.py's STATIC_PATH), so requests should be relative --
          # app/src/config.ts already falls back to "" when this is unset,
          # but setting it explicitly here documents the intent.
          VITE_API_BASE: ""
        run: |
          npm install
          npm run build -w app

      - name: Copy frontend + example data into standalone/
        shell: bash
        run: |
          rm -rf gramps-connect/standalone/frontend
          cp -r gramps-connect/app/dist gramps-connect/standalone/frontend
          cp gramps/example/gramps/example.gramps gramps-connect/standalone/example.gramps
          rm -rf gramps-connect/standalone/example-media
          cp -r gramps/example/gramps gramps-connect/standalone/example-media

      - name: Install gramps + gramps-web-api (editable, from source)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e gramps --no-deps
          pip install -e gramps-web-api --no-deps

      # Every non-gramps/non-PyGObject entry in gramps-web-api's own
      # pyproject.toml [project.dependencies] -- copied from there
      # directly rather than reconstructed from memory, after an earlier
      # attempt at this list omitted bleach's [css] extra (tinycss2) and
      # was only caught by actually running a downloaded CI artifact, not
      # by the build succeeding. gramps[all] is skipped (gramps itself is
      # supplied via the editable checkout below) and PyGObject is skipped
      # intentionally (stubbed, see above). pdf2image/ffmpeg-python/boto3/
      # pytesseract are skipped too -- real pyproject deps, but only for
      # the optional features excluded in the .spec (PDF/video conversion,
      # S3 storage, OCR) -- confirmed via each call site earlier, not
      # guessed. Everything below is a normal published PyPI package
      # (unlike gramps/gramps-web-api themselves, which are unreleased/
      # local branches).
      - name: Install remaining Python dependencies
        shell: bash
        run: |
          pip install \
            pyinstaller pyinstaller-hooks-contrib \
            orjson Click Flask "Flask-Caching>=2.0.0" Flask-Compress Flask-Cors \
            "Flask-JWT-Extended!=4.4.0,!=4.4.1" "Flask-Limiter>=2.9.0" Flask-SQLAlchemy \
            "marshmallow>=3.13.0" waitress webargs "SQLAlchemy>=2.0.0" \
            "Pillow>=9.1.0,<12.0.0" "bleach[css]>=5.0.0" jsonschema \
            alembic "celery[redis]" Unidecode \
            "gramps-object-query-language>=0.3.1" "gramps-ql>=0.4.0" "object-ql>=0.1.3" \
            "sifts>=1.1.0" requests "yclade>=0.5.0" "Authlib>=1.6.4" gramps-gedcom7 \
            flask-smorest "typing-extensions>=4.13.0" \
            psycopg2-binary

      - name: Build with PyInstaller
        working-directory: gramps-connect/standalone
        run: pyinstaller gramps-connect-demo.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramps-connect-demo-${{ matrix.os }}
          path: gramps-connect/standalone/dist/gramps-connect-demo
          if-no-files-found: error
