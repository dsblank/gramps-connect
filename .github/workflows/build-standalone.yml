name: Build standalone demo

# Manual trigger only -- this is an experimental PyInstaller build (see
# standalone/), not part of the normal dev workflow, and Windows/macOS
# runners are the whole point of running it here: PyInstaller can't
# cross-compile, so producing those binaries requires actually running on
# those OSes, which no local dev machine in this project has.
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub release from this build (in addition to building)"
        type: boolean
        default: false
      whats_new:
        description: >-
          User-facing "What's new" bullets (Markdown, one "- " per line).
          Only used if create_release is checked. Keep it UX-level -- no
          dev-only/internal changes.
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64) as of the macos-14 image;
        # macos-15-intel is the Intel (x86_64) image GitHub hosts (macos-13
        # was retired Dec 2025), needed because PyInstaller bundles a native
        # binary for the runner's own arch only -- an arm64 build errors
        # "bad CPU type in executable" on Intel Macs. `label` names the
        # upload artifact / zip so it stays stable even if GitHub re-points
        # macos-latest again. Linux has its own job below (build-linux) --
        # it needs a completely different toolchain (see that job's
        # comments), not just a different `os:`.
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v7
        with:
          path: gramps-connect

      # gramps' core install (install_requires=["orjson"]) never pulls in
      # PyGObject -- that's GUI-only extras -- so a plain editable install
      # is enough; standalone/runtime_hooks/rthook_gi_stub.py replaces the
      # one place gramps-web-api's reachable code path unconditionally
      # touches `gi` (gen/const.py's XDG-path lookups) with a small stub,
      # so real PyGObject/GTK -- notoriously painful to bundle with
      # PyInstaller on every platform, and the reason Gramps' own macOS
      # build uses a separate jhbuild toolchain instead -- is never needed
      # at all here.
      - name: Check out gramps (maintenance/gramps60)
        uses: actions/checkout@v7
        with:
          repository: gramps-project/gramps
          ref: maintenance/gramps60
          path: gramps

      # The ten /api/<type>/query/ endpoints this project's client is built
      # on (https://github.com/gramps-project/gramps-web-api/pull/913) are
      # merged upstream now, so this tracks gramps-project master rather
      # than the dsblank/gramps-web-api feat/object-query-endpoints branch
      # it used to (matches deploy/Dockerfile's own switch).
      - name: Check out gramps-web-api (master)
        uses: actions/checkout@v7
        with:
          repository: gramps-project/gramps-web-api
          ref: master
          path: gramps-web-api

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build app/ frontend
        working-directory: gramps-connect
        env:
          # Frontend and API share an origin in this build (see
          # launcher.py's STATIC_PATH), so requests should be relative --
          # app/src/config.ts already falls back to "" when this is unset,
          # but setting it explicitly here documents the intent.
          VITE_API_BASE: ""
        run: |
          npm install
          npm run build -w app

      - name: Copy frontend into standalone/
        shell: bash
        run: |
          rm -rf gramps-connect/standalone/frontend
          cp -r gramps-connect/app/dist gramps-connect/standalone/frontend

      - name: Install gramps + gramps-web-api (editable, from source)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e gramps --no-deps
          pip install -e gramps-web-api --no-deps

      # Read straight out of gramps-web-api's own pyproject.toml rather than
      # hand-copied, using the same filter deploy/Dockerfile.slim already
      # uses -- a hand-copied list here had already drifted (it pinned
      # gramps-object-query-language>=0.3.1 where upstream now says
      # >=0.3.4,<0.4) and would silently miss anything added upstream.
      # gramps[all]/PyGObject are skipped by the script (supplied via the
      # editable checkout above / stubbed, see above); pdf2image/
      # ffmpeg-python/boto3/pytesseract are skipped too -- real pyproject
      # deps, but only for optional features this build excludes (PDF/video
      # conversion, S3 storage, OCR; see the .spec's `excludes`).
      - name: Install remaining Python dependencies
        shell: bash
        run: |
          pip install pyinstaller pyinstaller-hooks-contrib
          python gramps-connect/deploy/webapi-requirements.py gramps-web-api/pyproject.toml > requirements.txt
          cat requirements.txt
          pip install -r requirements.txt psycopg2-binary
          # Opens the demo in a native window (WebView2/WKWebView/GTK3+
          # WebKit2) instead of a browser tab. Its Windows (pythonnet) and
          # macOS (pyobjc-*) backend deps are pulled in automatically by
          # pywebview's own platform-conditional requires-dist markers; on
          # Linux there's no equivalent bundled backend (see the .spec's
          # gi-stub comment), so launcher.py falls back to a browser tab at
          # runtime there instead.
          pip install pywebview

      - name: Build with PyInstaller
        working-directory: gramps-connect/standalone
        run: pyinstaller gramps-connect-demo.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: gramps-connect-demo-${{ matrix.label }}
          path: gramps-connect/standalone/dist/gramps-connect-demo
          if-no-files-found: error

  # Packaged as .deb/.rpm rather than a raw portable binary (unlike the
  # Windows/macOS legs above) -- proper install location, a menu entry, and
  # clean apt/dnf install-or-uninstall, instead of an unpacked folder the
  # tester has to manage by hand. Native-window support (see pywebview in
  # launcher.py) still isn't available on Linux either way: the frozen
  # bundle's own gi-stub (runtime_hooks/rthook_gi_stub.py) blocks it
  # regardless of what's installed on the target system, so this
  # deliberately does NOT declare a GTK3/WebKit2 package dependency -- it
  # would just make apt install libraries this build can't actually reach.
  # Falls back to a browser tab there, same as the raw binary would.
  build-linux:
    runs-on: ubuntu-latest
    # AlmaLinux 8 base -- glibc 2.28, forward-compatible with essentially
    # every non-EOL glibc-based distro (Ubuntu 20.04+, Debian 10+, RHEL/
    # Alma/Rocky 8+, ...), unlike a binary built directly on ubuntu-latest
    # (glibc 2.39), which only runs on systems with equal-or-newer glibc --
    # i.e. not even this project's own dev machines. This container only
    # exists for the CI build; end users installing the resulting .deb/.rpm
    # never see or need Docker themselves.
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v7
        with:
          path: gramps-connect

      - name: Check out gramps (maintenance/gramps60)
        uses: actions/checkout@v7
        with:
          repository: gramps-project/gramps
          ref: maintenance/gramps60
          path: gramps

      - name: Check out gramps-web-api (master)
        uses: actions/checkout@v7
        with:
          repository: gramps-project/gramps-web-api
          ref: master
          path: gramps-web-api

      # No actions/setup-python or actions/setup-node here (unlike the
      # Windows/macOS job) -- this container needs its own toolchain built
      # up by hand instead:
      #   - manylinux's own /opt/python/cp312-cp312/ interpreter is
      #     deliberately built *without* --enable-shared (it exists for
      #     building portable wheels, not for embedding), and PyInstaller
      #     needs libpython3.12.so -- so build a real one via pyenv. This is
      #     the known community-standard fix for this exact combination
      #     (see e.g. oleksis/pyinstaller-manylinux); confirmed locally,
      #     ~1 minute even for a full CPython compile from source.
      #   - Node and Ruby (for fpm, below) aren't in the base image at all;
      #     install via dnf module streams rather than a third-party repo.
      - name: Install build toolchain (Python, Node, Ruby)
        shell: bash
        run: |
          dnf module install -y nodejs:22/common ruby:3.3/common
          dnf install -y rpm-build bzip2-devel libffi-devel ncurses-devel \
            readline-devel sqlite-devel xz-devel tk-devel openssl-devel

          git clone --depth 1 https://github.com/pyenv/pyenv.git /opt/pyenv
          export PYENV_ROOT=/opt/pyenv
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          PYTHON_CONFIGURE_OPTS='--enable-shared' pyenv install 3.12.8

          echo "/opt/pyenv/versions/3.12.8/bin" >> "$GITHUB_PATH"

      - name: Build app/ frontend
        working-directory: gramps-connect
        env:
          VITE_API_BASE: ""
        run: |
          npm install
          npm run build -w app

      - name: Copy frontend into standalone/
        shell: bash
        run: |
          rm -rf gramps-connect/standalone/frontend
          cp -r gramps-connect/app/dist gramps-connect/standalone/frontend

      - name: Install gramps + gramps-web-api (editable, from source)
        shell: bash
        run: |
          python3 -m venv /tmp/venv
          echo "VIRTUAL_ENV=/tmp/venv" >> "$GITHUB_ENV"
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/pip install -e gramps --no-deps
          /tmp/venv/bin/pip install -e gramps-web-api --no-deps

      - name: Install remaining Python dependencies
        shell: bash
        run: |
          pip install pyinstaller pyinstaller-hooks-contrib
          python gramps-connect/deploy/webapi-requirements.py gramps-web-api/pyproject.toml > requirements.txt
          cat requirements.txt
          pip install -r requirements.txt psycopg2-binary
          pip install pywebview

      - name: Build with PyInstaller
        working-directory: gramps-connect/standalone
        run: pyinstaller gramps-connect-demo.spec --noconfirm

      - name: Package .deb and .rpm
        working-directory: gramps-connect/standalone
        shell: bash
        run: |
          gem install --no-document fpm
          VERSION=$(node -p "require('../app/package.json').version")
          for target in deb rpm; do
            fpm -s dir -t "$target" \
              -n gramps-connect-demo \
              -v "$VERSION" \
              --license AGPL-3.0-or-later \
              --description "Standalone Gramps Connect demo -- local-first genealogy client + bundled server, no separate install required." \
              --url "https://github.com/dsblank/gramps-connect" \
              --force \
              dist/gramps-connect-demo/=/opt/gramps-connect-demo/ \
              packaging/gramps-connect-demo.desktop=/usr/share/applications/gramps-connect-demo.desktop \
              packaging/gramps-connect-demo=/usr/bin/gramps-connect-demo \
              ../app/public/apple-touch-icon.png=/usr/share/pixmaps/gramps-connect-demo.png
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: gramps-connect-demo-linux
          path: |
            gramps-connect/standalone/*.deb
            gramps-connect/standalone/*.rpm
          if-no-files-found: error

  # Optional, gated by the create_release input -- separate from `build`/
  # `build-linux` above so this workflow can still be run for a plain test
  # build (create_release left unchecked) without publishing anything.
  # Reproduces by hand what used to be a manual `gh release create` --
  # download every leg's artifact, zip the raw Windows/macOS folders (the
  # .deb/.rpm from build-linux need no further packaging), tag the release
  # off app/package.json's version, mark the previous standalone-demo-v*
  # release [superseded], and publish.
  release:
    needs: [build, build-linux]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out gramps-connect
        uses: actions/checkout@v7
        with:
          path: gramps-connect

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip Windows/macOS artifacts
        shell: bash
        run: |
          for label in windows macos-arm64 macos-intel; do
            mv "artifacts/gramps-connect-demo-$label" artifacts/gramps-connect-demo
            (cd artifacts && zip -q -r "gramps-connect-demo-$label.zip" gramps-connect-demo)
            rm -rf artifacts/gramps-connect-demo
          done
          ls artifacts/gramps-connect-demo-linux

      - name: Determine version
        run: echo "VERSION=$(node -p "require('./gramps-connect/app/package.json').version")" >> "$GITHUB_ENV"

      # Best-effort -- there may be no prior standalone-demo-v* release yet
      # (e.g. the very first one), which is fine, not an error.
      - name: Mark previous release as superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,name,createdAt --limit 100)
          PREV=$(echo "$ALL" | jq --arg cur "standalone-demo-v$VERSION" '
            [.[] | select((.tagName | startswith("standalone-demo-v")) and .tagName != $cur)]
            | sort_by(.createdAt) | last')
          PREV_TAG=$(echo "$PREV" | jq -r '.tagName // empty')
          PREV_NAME=$(echo "$PREV" | jq -r '.name // empty')
          if [ -n "$PREV_TAG" ] && [[ "$PREV_NAME" != *"[superseded]"* ]]; then
            gh release edit "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --title "$PREV_NAME [superseded]"
          fi

      - name: Write release notes
        env:
          # Piped through env rather than interpolated directly into the
          # script -- this is a workflow_dispatch input (arbitrary text
          # from whoever triggers the run), and $-substituting it straight
          # into `run:` would let shell metacharacters in it escape into
          # the script.
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          {
            echo "## Gramps Connect -- standalone demo (experimental)"
            echo
            echo "**This is an early-stage research prototype, not a finished product.** See the [main README](https://github.com/$GITHUB_REPOSITORY#readme) for what this project actually is."
            echo
            echo "For install instructions and troubleshooting for your platform, see the [Installing](https://github.com/$GITHUB_REPOSITORY#installing) and [Troubleshooting](https://github.com/$GITHUB_REPOSITORY#troubleshooting) sections of the README."
            if [ -n "$WHATS_NEW" ]; then
              echo
              echo "### What's new"
              echo
              echo "$WHATS_NEW"
            fi
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "standalone-demo-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Standalone demo v$VERSION (experimental)" \
            --prerelease \
            --target main \
            --notes-file notes.md \
            artifacts/gramps-connect-demo-windows.zip \
            artifacts/gramps-connect-demo-macos-arm64.zip \
            artifacts/gramps-connect-demo-macos-intel.zip \
            artifacts/gramps-connect-demo-linux/*.deb \
            artifacts/gramps-connect-demo-linux/*.rpm
