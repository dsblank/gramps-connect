<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<script src="tour.js"></script>
<script>
// Set the page's title, description, icon and language from tour.js before anything renders.
(function (t) {
  document.documentElement.lang = t.lang || "en";
  document.title = t.title || "";
  const m = document.createElement("meta"); m.name = "description"; m.content = t.description || ""; document.head.appendChild(m);
  if (t.icon) { const l = document.createElement("link"); l.rel = "icon"; l.href = t.icon; document.head.appendChild(l); }
})(window.TOUR);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a two-column "screening room". Left: the app plays in a window frame with a guided cursor and camera. Right: one column of narration that follows along. */
:root {
  --bg: #eef1f5;
  --stage: #dfe4eb;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5d6877;
  --faint: #9aa4b2;
  --line: #d6dce5;
  --accent: #1c6fd1;
  --cursor-ring: #e8590c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --stage: #0b0f14; --surface: #18202a; --ink: #e5eaf1; --muted: #9ba7b7; --faint: #5f6b7b;
    --line: #283342; --accent: #5ea2f0; --cursor-ring: #ff7a33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --stage: #0b0f14; --surface: #18202a; --ink: #e5eaf1; --muted: #9ba7b7; --faint: #5f6b7b;
  --line: #283342; --accent: #5ea2f0; --cursor-ring: #ff7a33; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

.app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px;
}

/* ---- Left: stage ---- */
.left {
  min-width: 0; display: flex; flex-direction: column; gap: 14px;
  background: var(--stage);
  padding-block: 20px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
}
.window {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  border-radius: 12px; overflow: hidden; background: var(--surface);
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 50px rgba(15,25,40,.18);
}
.titlebar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--line); flex: none; }
.titlebar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; flex: none; }
.titlebar .url { margin-left: 10px; flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--muted); background: var(--surface); border-radius: 6px; padding: 3px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewport { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #fff; }
.layer { position: absolute; left: 0; top: 0; width: var(--iw); height: var(--ih); transform-origin: 0 0; will-change: transform; }
.layer.anim { transition: transform 1.3s cubic-bezier(.45,.05,.25,1); }
.layer img { position: absolute; inset: 0; width: var(--iw); height: var(--ih); display: block; transition: opacity .7s ease; }
.typed {
  position: absolute; font: 400 13px var(--font-body); color: #212529; white-space: pre;
  background: #fff; padding: 0 2px; line-height: 18px;
}
.typed::after { content: ""; display: inline-block; width: 1px; height: 14px; background: #212529; margin-left: 1px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; pointer-events: none; transform-origin: 0 0; z-index: 3; }
.cursor svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--cursor-ring); pointer-events: none; z-index: 2; animation: ripple .7s ease-out forwards; }
@keyframes ripple { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }

/* Controls */
.controls { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn {
  font: 600 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.play { background: var(--accent); border-color: var(--accent); color: #fff; padding: 0 18px 0 14px; }
.btn.play:hover { filter: brightness(1.08); color: #fff; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn.icon { width: 38px; padding: 0; justify-content: center; }
.track { flex: 1 1 220px; min-width: 0; display: flex; gap: 4px; }
.seg { flex: 1 1 0; display: flex; flex-direction: column; gap: 5px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; text-align: left; }
.seg .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.seg .bar div { height: 100%; width: 0; background: var(--accent); }
.seg span { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg[aria-current="true"] span { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- Right: narration ---- */
.right {
  min-width: 0; overflow-y: auto; background: var(--bg); border-left: 1px solid var(--line);
  padding-block: 32px 40vh;
  padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; margin: 6px 0 10px; text-wrap: balance; }
.intro { color: var(--muted); margin: 0 0 28px; }
section.scene { margin-bottom: 26px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
h2 small { font: 600 12px var(--font-body); color: var(--faint); font-variant-numeric: tabular-nums; }
.step {
  display: block; width: 100%; text-align: left; font: inherit; color: var(--faint); background: none; border: 0;
  padding: 6px 0 6px 14px; margin: 0; border-left: 2px solid transparent; cursor: pointer; transition: color .3s, border-color .3s;
}
.step:hover { color: var(--muted); }
.step.done { color: var(--muted); }
.step.active { color: var(--ink); border-left-color: var(--accent); }
/* Highlighter: each word's marker stroke sweeps in as it is read */
:root { --hl: rgba(255, 213, 0, .55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hl: rgba(250, 204, 21, .30); } }
:root[data-theme="dark"] { --hl: rgba(250, 204, 21, .30); }
.w {
  background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat; background-position: 0 60%;
  background-size: 0% 78%; transition: background-size .28s linear; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  border-radius: 2px;
}
.w.hl { background-size: 100% 78%; }
.btn.icon[aria-pressed="false"] { color: var(--faint); }
.voicepick { display: flex; align-items: center; gap: 8px; margin: -16px 0 28px; font-size: 13px; color: var(--muted); }
.voicepick select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; flex: 1 1 auto; max-width: 260px; }
.credits { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.credits p { margin: 0 0 6px; }
.credits a { color: var(--accent); }

/* Card (a step with "card"): a title card with links, in place of a screenshot */
.card {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: var(--surface); overflow-y: auto; animation: cardin .6s ease;
}
.card[hidden] { display: none; }
.card.out { opacity: 0; transition: opacity .8s ease; pointer-events: none; }
@keyframes cardin { from { opacity: 0; } to { opacity: 1; } }
.cardinner { max-width: 560px; text-align: center; }
.cardlogo { width: 56px; height: 56px; display: block; margin: 0 auto 10px; }
.cardtitle { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; margin: 0 0 4px; display: block; }
.cardsub { color: var(--muted); margin: 0 0 20px; }
.cardbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
.cardbtn {
  font: 600 14px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 16px; text-decoration: none;
}
.cardbtn:hover { border-color: var(--accent); color: var(--accent); }
.cardbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.cardbtn.primary:hover { filter: brightness(1.08); color: #fff; }
.cardlinks { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.9; }
.cardlinks a { color: var(--accent); text-decoration: none; }
.cardlinks a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  .card { padding: 12px; } .cardlogo { width: 32px; height: 32px; margin-bottom: 4px; }
  .cardtitle { font-size: 18px; } .cardsub { margin-bottom: 8px; font-size: 13px; }
  .cardbtns { gap: 6px; margin-bottom: 8px; } .cardbtn { font-size: 12px; padding: 5px 10px; } .cardlinks { font-size: 11px; line-height: 1.6; }
}

/* Edit mode (index.html?edit): click a screenshot to read its coordinates */
.editbar { flex: none; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.editbar .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.editbar strong { font-weight: 600; margin-right: 4px; }
.editbar .hint { color: var(--muted); }
.editbar button { font: 600 12px var(--font-body); height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.editbar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.editbar button:disabled { opacity: .45; cursor: default; }
.editbar code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
body.editing .viewport { cursor: crosshair; }
.pick { position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border: 2px solid #e8590c; border-radius: 50%; box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #fff; pointer-events: none; z-index: 4; }
.pick[hidden], .editbar[hidden], .voicepick[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .layer.anim { transition: none; }
  .layer img { transition: none; }
  .ripple { display: none; }
  .w { transition: none; }
}

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .left { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
  .window { flex: none; }
  .viewport { flex: none; aspect-ratio: var(--iw-n) / var(--ih-n); max-width: 100%; }
  .right { overflow: visible; border-left: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .track .seg span { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="window">
      <div class="titlebar" aria-hidden="true"><i></i><i></i><i></i><div class="url" id="url"></div></div>
      <div class="viewport" id="viewport">
        <div class="layer" id="layer">
          <img id="imgA" alt="">
          <img id="imgB" alt="" style="opacity:0">
          <div class="typed" id="typed" hidden></div>
          <div class="pick" id="pickMark" hidden></div>
          <div class="cursor" id="cursor" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 2 L3 19 L7.6 14.8 L10.6 21.6 L13.6 20.3 L10.7 13.6 L17 13.6 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="card" id="card" hidden></div>
      </div>
    </div>
    <div class="editbar" id="editbar" hidden>
      <div class="row"><strong>Edit mode</strong><span class="hint" id="editInfo"></span></div>
      <div class="row">
        <button type="button" data-act="cur" data-needs-pick>Pointer here</button>
        <button type="button" data-act="cam" data-needs-pick>Camera here</button>
        <button type="button" data-act="typeAt" data-needs-pick data-needs-type>Typing here</button>
        <button type="button" data-act="zout">Zoom −</button>
        <button type="button" data-act="zin">Zoom +</button>
        <button type="button" data-act="click">Click: off</button>
        <button type="button" data-act="copy-step">Copy step</button>
        <button type="button" data-act="copy-all">Copy tour.js</button>
      </div>
      <code id="editCode"></code>
    </div>
    <div class="controls">
      <button class="btn play" id="play" type="button"><svg id="playIcon" viewBox="0 0 14 14"><path d="M3 1.5v11l9.5-5.5z"/></svg><span id="playLabel"></span></button>
      <button class="btn icon" id="prev" type="button" ><svg viewBox="0 0 14 14"><path d="M2 2h2v10H2zM12.5 2v10L5 7z"/></svg></button>
      <button class="btn icon" id="next" type="button" ><svg viewBox="0 0 14 14"><path d="M10 2h2v10h-2zM1.5 2v10L9 7z"/></svg></button>
      <button class="btn icon" id="voice" type="button" aria-pressed="true"><svg viewBox="0 0 14 14"><path d="M1.5 5h2.5l3.5-3v10L4 9H1.5z"/><path id="voiceWaves" d="M9.6 4.4a3.6 3.6 0 0 1 0 5.2M11.3 2.8a5.9 5.9 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path id="voiceOff" d="M9.5 5l3.5 4M13 5l-3.5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="display:none"/></svg></button>
      <div class="track" id="track"></div>
    </div>
  </div>

  <aside class="right" id="right">
    <div class="kicker" id="kicker"></div>
    <h1 id="heading"></h1>
    <p class="intro" id="intro"></p>
    <label class="voicepick" id="voicepick" hidden><span id="voiceLabel"></span> <select id="voiceSel"></select></label>
    <div id="script"></div>
    <div class="credits" id="credits"></div>
  </aside>
</div>

<script>
// Everything the tour says and shows comes from tour.js (window.TOUR); this file is only the player.
const TOUR = window.TOUR, SCENES = TOUR.scenes, L = TOUR.labels || {};
const [IW, IH] = TOUR.screen || [1519, 784];
const LANG = TOUR.lang || "en-US";
document.documentElement.style.cssText += `--iw:${IW}px;--ih:${IH}px;--iw-n:${IW};--ih-n:${IH}`;

// <serialize> Writes tour.js in its standard layout: one JSON object, assigned to window.TOUR.
// Used by edit mode's "Copy tour.js"; the same code generated the file, so a copy round-trips exactly.
const TOUR_HEADER = `// The Gramps Connect tour: everything it says and shows. index.html is the player and needs no changes.
// Everything after "window.TOUR =" is plain JSON. See README.md for what each field means.
// To find coordinates, open index.html?edit and click on a screenshot.
`;
// Compact JSON: a value stays on one line when that line fits in about 110 columns, otherwise
// one entry per line. `ind` is the indent of the line the value starts on, `col` the column it starts at.
function pretty(v, ind = 0, col = ind) {
  const flat = JSON.stringify(v, null, 1).replace(/\n\s*/g, " ").replace(/\[ /g, "[").replace(/ \]/g, "]");
  if (v === null || typeof v !== "object" || col + flat.length <= 110) return flat;
  const inner = ind + 2, pad = " ".repeat(inner), arr = Array.isArray(v);
  const items = arr ? v.map(x => pad + pretty(x, inner))
    : Object.keys(v).map(k => { const key = JSON.stringify(k) + ": "; return pad + key + pretty(v[k], inner, inner + key.length); });
  return (arr ? "[\n" : "{\n") + items.join(",\n") + "\n" + " ".repeat(ind) + (arr ? "]" : "}");
}
// A step: its staging on the first line(s), its narration last.
function fmtStep(st, ind = 6) {
  const { text, ...rest } = st, pad = " ".repeat(ind + 2);
  const head = Object.keys(rest).map(k => `${JSON.stringify(k)}: ${pretty(rest[k], ind + 2, ind + 4 + k.length)}`).join(", ");
  return `{ ${head},\n${pad}"text": ${JSON.stringify(text)} }`;
}
function fmtScene(sc) {
  const { steps, ...rest } = sc;
  return `    { ${pretty(rest).slice(1, -1).trim()}, "steps": [\n` + steps.map(st => "      " + fmtStep(st)).join(",\n") + "\n    ]}";
}
function serializeTour(tour) {
  const { scenes, ...rest } = tour;
  const top = Object.keys(rest).map(k => `  ${JSON.stringify(k)}: ${pretty(rest[k], 2, 6 + k.length)}`);
  top.push(`  "scenes": [\n${scenes.map(fmtScene).join(",\n")}\n  ]`);
  return TOUR_HEADER + "window.TOUR = {\n" + top.join(",\n") + "\n};\n";
}
// </serialize>

// ---------- text from tour.js ----------
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const linkAttrs = (href) => `href="${esc(href)}"` + (/^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : "");
const linkRow = (links) => (links || []).map(l => `<a ${linkAttrs(l.href)}>${esc(l.label)}</a>`).join(" · ");
const label = (key, vars = {}) => (L[key] || "").replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
function fillText() {
  $("kicker").textContent = TOUR.kicker || "";
  $("heading").textContent = TOUR.heading || "";
  $("intro").textContent = TOUR.intro || "";
  $("playLabel").textContent = label("play");
  $("voiceLabel").textContent = label("voice");
  $("viewport").setAttribute("aria-label", label("stage"));
  $("prev").setAttribute("aria-label", label("previous"));
  $("next").setAttribute("aria-label", label("next"));
  const c = TOUR.credits || {};
  $("credits").innerHTML = (c.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join("") +
    (c.links?.length ? `<p>${linkRow(c.links)}</p>` : "");
}
function cardHtml(card) {
  return `<div class="cardinner">` +
    (card.logo ? `<img class="cardlogo" src="${esc(card.logo)}" alt="">` : "") +
    (card.title ? `<h2 class="cardtitle">${esc(card.title)}</h2>` : "") +
    (card.subtitle ? `<p class="cardsub">${esc(card.subtitle)}</p>` : "") +
    (card.buttons?.length ? `<div class="cardbtns">${card.buttons.map(b =>
      `<a class="cardbtn${b.primary ? " primary" : ""}" ${linkAttrs(b.href)}>${esc(b.label)}</a>`).join("")}</div>` : "") +
    (card.links?.length ? `<p class="cardlinks">${linkRow(card.links)}</p>` : "") +
    `</div>`;
}

// ---------- engine ----------
function $(id) { return document.getElementById(id); }
const viewport = $("viewport"), layer = $("layer"), cursorEl = $("cursor"), typedEl = $("typed");
const imgs = [$("imgA"), $("imgB")]; let front = 0;
const STEPS = []; SCENES.forEach((s, si) => s.steps.forEach((st, k) => STEPS.push({ ...st, scene: si, k,
  words: [...st.text.matchAll(/\S+\s*/g)].map(m => ({ s: m.index, t: m[0] })) })));
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Preload
const cache = {}; for (const s of STEPS) if (s.img && !cache[s.img]) { const im = new Image(); im.src = `img/${s.img}.jpg`; cache[s.img] = im; }

let idx = 0, playing = false, timer = null, stepStart = 0, stepDur = 0, rafId = 0, finished = false, firstShow = true;
let cam = { cx: IW / 2, cy: IH / 2, z: 1 }, cur = { x: 760, y: 420 }, curScale = 1;

function fitScale() { return Math.min(viewport.clientWidth / IW, viewport.clientHeight / IH); }
function applyCam(animate) {
  const W = viewport.clientWidth, H = viewport.clientHeight;
  const base = fitScale();
  const s = base * cam.z;
  let tx = W / 2 - cam.cx * s, ty = H / 2 - cam.cy * s;
  // keep the screenshot covering the viewport (no blank edges) when zoomed in
  const iw = IW * s, ih = IH * s;
  tx = iw <= W ? (W - iw) / 2 : Math.min(0, Math.max(W - iw, tx));
  ty = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, ty));
  layer.classList.toggle("anim", !!animate && !reduce);
  layer.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  curScale = 1 / s * Math.max(.9, Math.min(1.25, base * 1.6)); // cursor stays a steady on-screen size
  placeCursor(false);
}
function placeCursor(animate) {
  cursorEl.style.transition = animate && !reduce ? "left 1.1s cubic-bezier(.45,.05,.25,1), top 1.1s cubic-bezier(.45,.05,.25,1)" : "none";
  cursorEl.style.left = cur.x + "px"; cursorEl.style.top = cur.y + "px";
  cursorEl.style.transform = `scale(${curScale})`;
}
function setImage(name) {
  const src = `img/${name}.jpg`;
  if (imgs[front].getAttribute("src") === src) return;
  const back = 1 - front;
  imgs[back].src = src; imgs[back].alt = "";
  imgs[back].style.opacity = 1; imgs[front].style.opacity = 0;
  front = back;
}
function ripple() {
  if (reduce) return;
  const r = document.createElement("div"); r.className = "ripple";
  r.style.left = cur.x + "px"; r.style.top = cur.y + "px";
  r.style.transform = `scale(${curScale})`;
  layer.appendChild(r); setTimeout(() => r.remove(), 800);
}
let typeTimer = null;
function typeText(text, at) {
  clearInterval(typeTimer);
  typedEl.hidden = false; typedEl.textContent = "";
  typedEl.style.left = at[0] + "px"; typedEl.style.top = at[1] + "px";
  let i = 0;
  typeTimer = setInterval(() => { typedEl.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typeTimer); }, reduce ? 0 : 110);
}

function durationFor(st) { return Math.max(3600, st.text.length * 58) + (st.type ? 900 : 0); }

let pending = [];
function clearPending() { pending.forEach(clearTimeout); pending = []; clearInterval(typeTimer); }

// ---------- reading position, highlight & voice ----------
// `pos` = how many characters of the current line have been read. With the voice on it follows the
// speech (word-boundary events, or an estimate for voices that don't send them); muted, it follows the clock.
let pos = 0, speakToken = 0, speakBase = 0, speakStart = 0, gotBoundary = false, spoken = false;
let charsPerMs = 0.014;                       // re-measured after each line a voice reads without boundary events
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voiceOn = !!synth, voice = null, voiceName = "";
try { if (localStorage.getItem("walk-voice") === "off") voiceOn = false; voiceName = localStorage.getItem("walk-voice-name") || ""; } catch (e) {}

function wordStart(p) { let s0 = 0; for (const w of STEPS[idx].words) { if (w.s <= p) s0 = w.s; else break; } return s0; }

function readPos() {
  const len = STEPS[idx].text.length;
  if (!playing) return pos;
  if (voiceOn && synth) {
    if (!gotBoundary && !spoken && speakStart)
      pos = Math.max(pos, Math.min(len - 1, speakBase + 0.5 + (performance.now() - speakStart) * charsPerMs));
    return pos;
  }
  return pos = Math.min(len, Math.max(0.5, (performance.now() - stepStart) / stepDur * len));
}

function speakFrom(offset) {
  const st = STEPS[idx], token = ++speakToken, text = st.text.slice(offset);
  synth.cancel();
  speakBase = offset; gotBoundary = false; spoken = false; speakStart = 0; pos = offset;
  if (!text.trim()) { finishSpeech(token); return; }
  const u = new SpeechSynthesisUtterance(text);
  if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = LANG;
  u.onstart = () => { if (token === speakToken) { speakStart = performance.now(); pos = Math.max(pos, speakBase + 0.5); } };
  u.onboundary = (e) => {
    if (token !== speakToken || (e.name && e.name !== "word")) return;
    gotBoundary = true; pos = Math.max(pos, speakBase + e.charIndex + 0.5);
  };
  u.onend = () => {
    if (token !== speakToken) return;
    if (!gotBoundary && speakStart) { const ms = performance.now() - speakStart; if (ms > 800) charsPerMs = charsPerMs * 0.4 + (text.length / ms) * 0.6; }
    finishSpeech(token);
  };
  u.onerror = (e) => {
    if (token !== speakToken) return;
    if (e.error === "not-allowed" || e.error === "synthesis-unavailable" || e.error === "synthesis-failed") {
      setVoice(false); if (playing) startReading();   // carry on silently
    } else finishSpeech(token);
  };
  synth.speak(u);
  clearTimeout(timer);                               // watchdog: some engines never send "end"
  timer = setTimeout(() => { if (token === speakToken) finishSpeech(token); }, text.length / charsPerMs * 2 + 5000);
}
function finishSpeech(token) {
  spoken = true; pos = STEPS[idx].text.length; paintHighlight();
  clearTimeout(timer);
  const since = performance.now() - stepStart;      // let the camera finish moving, then a short breath
  timer = setTimeout(() => { if (token === speakToken && playing) advance(); }, Math.max(650, 1700 - since));
}
function startReading() {
  clearTimeout(timer);
  if (voiceOn && synth) { speakFrom(wordStart(pos)); return; }
  speakToken++; if (synth) synth.cancel();
  const len = STEPS[idx].text.length, done = Math.min(1, pos / len);
  stepStart = performance.now() - done * stepDur;
  timer = setTimeout(advance, Math.max(600, stepDur * (1 - done)));
}
function stopReading() { clearTimeout(timer); speakToken++; if (synth) synth.cancel(); }

let paintedStep = -1, paintedN = -1;
function paintHighlight() {
  const st = STEPS[idx], p = readPos();
  let n = 0; for (const w of st.words) { if (w.s < p) n++; else break; }
  if (paintedStep === idx && paintedN === n) return;
  if (paintedStep !== idx && paintedStep >= 0) stepEls[paintedStep]?.querySelectorAll(".w.hl").forEach(w => w.classList.remove("hl"));
  paintedStep = idx; paintedN = n;
  stepEls[idx].querySelectorAll(".w").forEach((w, k) => w.classList.toggle("hl", k < n));
}

function setVoice(on) {
  voiceOn = on && !!synth;
  try { localStorage.setItem("walk-voice", voiceOn ? "on" : "off"); } catch (e) {}
  const b = $("voice");
  b.setAttribute("aria-pressed", String(voiceOn));
  b.title = label(voiceOn ? "readAloudOn" : "readAloudOff"); b.setAttribute("aria-label", b.title);
  $("voiceWaves").style.display = voiceOn ? "" : "none";
  $("voiceOff").style.display = voiceOn ? "none" : "";
}
const LANG_BASE = LANG.split(/[-_]/)[0].toLowerCase();
const sameLang = (v) => v.lang.toLowerCase().replace("_", "-").split("-")[0] === LANG_BASE;
function rankVoice(v) {
  let r = v.lang.toLowerCase().replace("_", "-") === LANG.toLowerCase() ? 4 : sameLang(v) ? 2 : -100;
  if (/natural|neural|premium|enhanced/i.test(v.name)) r += 8;
  if (/^Google/i.test(v.name)) r += 5;
  if (/Samantha|Aria|Jenny|Ava|Allison|Daniel|Karen|Serena/i.test(v.name)) r += 3;
  if (/espeak/i.test(v.name)) r -= 3;
  if (v.default) r += 1;
  return r;
}
function loadVoices() {
  if (!synth) return;
  let vs = synth.getVoices().filter(sameLang);
  if (!vs.length) vs = synth.getVoices();
  if (!vs.length) return;
  vs.sort((a, b) => rankVoice(b) - rankVoice(a));
  voice = vs.find(v => v.name === voiceName) || vs[0];
  $("voiceSel").innerHTML = vs.map((v, k) => `<option value="${k}">${v.name.replace(/</g, "&lt;")}</option>`).join("");
  $("voiceSel").value = String(vs.indexOf(voice));
  $("voiceSel").onchange = () => {
    voice = vs[+$("voiceSel").value]; voiceName = voice.name;
    try { localStorage.setItem("walk-voice-name", voiceName); } catch (e) {}
    if (playing && voiceOn) { readPos(); stopReading(); startReading(); }
  };
  $("voicepick").hidden = false;
}

function show(i, { animate = true } = {}) {
  clearPending();
  stopReading();
  idx = (i + STEPS.length) % STEPS.length;
  const st = STEPS[idx];
  typedEl.hidden = true;
  const card = $("card");
  if (st.card) {
    if (card.hidden || card.dataset.i !== String(idx)) { card.innerHTML = cardHtml(st.card); card.dataset.i = idx; }
    card.classList.remove("out"); card.hidden = false;
  } else if (!card.hidden) {                    // fade the card away to reveal the screenshot underneath
    if (animate && !reduce) { card.classList.add("out"); pending.push(setTimeout(() => { card.hidden = true; card.classList.remove("out"); }, 800)); }
    else { card.hidden = true; card.classList.remove("out"); }
  }
  cursorEl.hidden = !!st.card;
  if (st.img) setImage(st.img);
  if (st.cam) [cam.cx, cam.cy, cam.z] = st.cam;
  else [cam.cx, cam.cy, cam.z] = [IW / 2, IH / 2, 1];
  applyCam(animate);
  if (st.cur) cur = { x: st.cur[0], y: st.cur[1] };
  placeCursor(animate);
  const moveMs = animate && !reduce ? 1150 : 0;
  if (st.click) pending.push(setTimeout(ripple, moveMs));
  if (st.type) pending.push(setTimeout(() => typeText(st.type, st.typeAt || TOUR.typeAt || [131, 95]), moveMs + 250));
  const sc = SCENES[st.scene];
  // A step's own address or path wins over its scene's.
  $("url").textContent = st.address ?? (st.path != null ? (TOUR.address || "") + st.path
    : sc.address ?? (TOUR.address || "") + (sc.path || ""));
  updateScript();
  stepStart = performance.now(); stepDur = durationFor(st); pos = 0; finished = false;
  if (playing) startReading();
  updateTrack(); paintHighlight();
  if (EDIT) renderEdit();
}
function advance() {
  if (idx === STEPS.length - 1) { finished = true; setPlaying(false); return; }
  show(idx + 1);
}
function setPlaying(p) {
  if (!p && playing) { readPos(); stopReading(); }
  playing = p;
  $("playLabel").textContent = label(p ? "pause" : finished ? "replay" : "play");
  $("playIcon").innerHTML = p ? '<path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/>' : '<path d="M3 1.5v11l9.5-5.5z"/>';
  if (p) { startReading(); loop(); } else cancelAnimationFrame(rafId);
  paintHighlight();
}
function loop() { updateTrack(); paintHighlight(); if (playing) rafId = requestAnimationFrame(loop); }

// ---------- narration column & track ----------
function buildScript() {
  let n = 0;
  $("script").innerHTML = SCENES.map((s, si) => `
    <section class="scene"><h2><small>${si + 1}</small>${esc(s.title)}</h2>
      ${s.steps.map(() => { const st = STEPS[n]; return `<button type="button" class="step" data-i="${n++}">${st.words.map(w => `<span class="w">${esc(w.t)}</span>`).join("")}</button>`; }).join("")}
    </section>`).join("");
  $("script").addEventListener("click", e => {
    const b = e.target.closest(".step"); if (!b) return;
    show(+b.dataset.i);
  });
  $("track").innerHTML = SCENES.map((s, si) => `<button type="button" class="seg" data-s="${si}" aria-label="${esc(label("jumpTo", { scene: s.title }))}"><div class="bar"><div></div></div><span>${esc(s.title)}</span></button>`).join("");
  $("track").addEventListener("click", e => {
    const b = e.target.closest(".seg"); if (!b) return;
    show(STEPS.findIndex(st => st.scene === +b.dataset.s));
  });
}
function updateScript() {
  const right = $("right"), wide = window.matchMedia("(min-width: 901px)").matches;
  document.querySelectorAll(".step").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
    b.classList.toggle("done", i < idx);
    if (i === idx && wide && !firstShow) {
      const top = b.offsetTop - right.clientHeight * 0.3;
      right.scrollTo({ top, behavior: reduce ? "auto" : "smooth" });
    }
  });
}
function updateTrack() {
  const st = STEPS[idx];
  const frac = playing ? Math.min(1, readPos() / st.text.length) : 0;
  document.querySelectorAll(".seg").forEach((seg, si) => {
    const steps = SCENES[si].steps.length;
    let p = si < st.scene ? 1 : si > st.scene ? 0 : (st.k + frac) / steps;
    if (si === st.scene && !playing) p = (st.k + 1) / steps;
    seg.querySelector(".bar div").style.width = (p * 100) + "%";
    seg.setAttribute("aria-current", si === st.scene ? "true" : "false");
  });
}

$("play").addEventListener("click", () => {
  if (!playing && finished) { show(0); setPlaying(true); return; }
  setPlaying(!playing);
});
$("voice").addEventListener("click", () => {
  if (playing) { readPos(); stopReading(); setVoice(!voiceOn); startReading(); }
  else setVoice(!voiceOn);
});
$("prev").addEventListener("click", () => show(idx - 1));
$("next").addEventListener("click", () => show(idx + 1));
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && e.target === document.body) { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") show(idx + 1);
  else if (e.key === "ArrowLeft") show(idx - 1);
});
new ResizeObserver(() => applyCam(false)).observe(viewport);

// ---------- edit mode (index.html?edit) ----------
// Click a screenshot to pick a point (in screenshot pixels), apply it to the current step, preview it,
// then "Copy tour.js" and paste the whole file over tour/tour.js. Nothing is saved by the page itself.
var EDIT = new URLSearchParams(location.search).has("edit");
let picked = null;
const round2 = (n) => Math.round(n * 100) / 100;
function renderEdit() {
  const st = STEPS[idx];
  $("editInfo").textContent = `Step ${idx + 1} of ${STEPS.length} · ${SCENES[st.scene].title} · ` +
    (picked ? `picked x ${picked[0]}, y ${picked[1]}` : "click the screenshot to pick a point");
  $("editCode").textContent = fmtStep(SCENES[st.scene].steps[st.k], 0);
  $("editbar").querySelectorAll("button").forEach(b => {
    b.disabled = (st.card && !/^copy/.test(b.dataset.act)) ||
      (b.hasAttribute("data-needs-pick") && !picked) || (b.hasAttribute("data-needs-type") && !st.type);
  });
  $("editbar").querySelector('[data-act="click"]').textContent = st.click ? "Click: on" : "Click: off";
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = old), 1200);
}
function initEdit() {
  document.body.classList.add("editing");
  $("editbar").hidden = false;
  viewport.addEventListener("click", (e) => {
    const r = layer.getBoundingClientRect(), sc = r.width / IW;
    const x = Math.round((e.clientX - r.left) / sc), y = Math.round((e.clientY - r.top) / sc);
    if (x < 0 || y < 0 || x > IW || y > IH) return;
    picked = [x, y];
    const m = $("pickMark"); m.hidden = false; m.style.left = x + "px"; m.style.top = y + "px";
    m.style.transform = `scale(${curScale})`;
    renderEdit();
  });
  $("editbar").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]"); if (!b || b.disabled) return;
    const st = STEPS[idx], src = SCENES[st.scene].steps[st.k];
    const set = (key, val) => { if (val === undefined) { delete st[key]; delete src[key]; } else { st[key] = val; src[key] = val; } };
    switch (b.dataset.act) {
      case "cur": set("cur", [...picked]); break;
      case "cam": set("cam", [picked[0], picked[1], st.cam[2]]); break;
      case "typeAt": set("typeAt", [...picked]); break;
      case "zin": set("cam", [st.cam[0], st.cam[1], round2(st.cam[2] + 0.1)]); break;
      case "zout": set("cam", [st.cam[0], st.cam[1], Math.max(1, round2(st.cam[2] - 0.1))]); break;
      case "click": set("click", st.click ? undefined : true); break;
      case "copy-step": copyText(fmtStep(src), b); return;
      case "copy-all": copyText(serializeTour(TOUR), b); return;
    }
    if (playing) setPlaying(false);
    show(idx);                                  // preview the change
  });
}

fillText();
buildScript();
var stepEls = [...document.querySelectorAll(".step")];
if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); window.addEventListener("pagehide", () => synth.cancel()); }
else $("voice").hidden = true;
setVoice(voiceOn);
if (EDIT) initEdit();
imgs[0].src = `img/${STEPS.find(s => s.img).img}.jpg`;
show(0, { animate: false });
firstShow = false;
</script>
</body>
</html>
